<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="apple-touch-icon" href="favicon_zoia.png">
<link rel="icon" type="image/png" href="favicon_zoia.png">

<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#03131f">
  <title>ZoIA</title>
  <style>
    :root{
      --bg1:#03131f;
      --bg2:#071f30;
      --cyan:#4de2ff;
      --cyan2:#00bcd4;
      --blue:#5aa9ff;
      --glass:rgba(255,255,255,0.06);
      --glass-border:rgba(77,226,255,0.25);
      --text:#dffbff;
      --muted:#8fbac3;
      --danger:#ff5f7a;
      --ok:#63ffd2;
    }

    *{box-sizing:border-box}

    body{
      margin:0;
      min-height:100vh;
      display:flex;
      align-items:center;
      justify-content:center;
      background:
        radial-gradient(circle at 50% 50%, rgba(0,188,212,0.10), transparent 22%),
        radial-gradient(circle at 50% 50%, rgba(90,169,255,0.08), transparent 38%),
        linear-gradient(180deg,var(--bg2),var(--bg1));
      font-family: Inter, Arial, sans-serif;
      color:var(--text);
      overflow:hidden;
    }

    .hud-bg{
      position:fixed;
      inset:0;
      pointer-events:none;
      background:
        radial-gradient(circle at center, rgba(77,226,255,0.08) 0 2px, transparent 2px 100%),
        linear-gradient(rgba(77,226,255,0.05) 1px, transparent 1px),
        linear-gradient(90deg, rgba(77,226,255,0.05) 1px, transparent 1px);
      background-size:100% 100%, 100% 34px, 34px 100%;
      mask-image: radial-gradient(circle at center, black 0%, rgba(0,0,0,0.85) 45%, transparent 85%);
      opacity:.35;
    }

    .panel{
      position:relative;
      width:min(92vw, 560px);
      padding: 36px 24px 32px;
      border:1px solid var(--glass-border);
      border-radius:28px;
      background:linear-gradient(180deg, rgba(255,255,255,0.08), rgba(255,255,255,0.03));
      backdrop-filter: blur(12px);
      box-shadow:
        0 0 0 1px rgba(77,226,255,0.06) inset,
        0 0 30px rgba(0,188,212,0.12),
        0 0 90px rgba(0,188,212,0.08);
    }
	


    .panel::before,
    .panel::after{
      content:"";
      position:absolute;
      width:80px;
      height:80px;
      border:2px solid rgba(77,226,255,0.4);
      opacity:.55;
      pointer-events:none;
    }

    .panel::before{
      top:12px;
      left:12px;
      border-right:none;
      border-bottom:none;
      border-radius:18px 0 0 0;
    }

    .panel::after{
      right:12px;
      bottom:12px;
      border-left:none;
      border-top:none;
      border-radius:0 0 18px 0;
    }

    .title{
      text-align:center;
      font-size:12px;
      letter-spacing:.35em;
      text-transform:uppercase;
      color:var(--muted);
      margin-bottom:10px;
    }

    .status{
      text-align:center;
      font-size:16px;
      min-height:24px;
      color:var(--text);
      margin-bottom:26px;
    }

    .core-wrap{
      position:relative;
      width:220px;
      height:220px;
      margin:0 auto 24px;
      display:grid;
      place-items:center;
    }


    .ring,
    .ring::before,
    .ring::after{
      position:absolute;
      border-radius:50%;
      inset:0;
    }

    .ring{
      border:1px solid rgba(77,226,255,0.35);
      box-shadow:0 0 20px rgba(77,226,255,0.18), inset 0 0 12px rgba(77,226,255,0.15);
      animation: rotateSlow 18s linear infinite;
    }

    .ring::before{
      content:"";
      inset:16px;
      border:1px dashed rgba(77,226,255,0.28);
      animation: rotateReverse 14s linear infinite;
    }

    .ring::after{
      content:"";
      inset:34px;
      border:1px solid rgba(90,169,255,0.35);
      box-shadow:0 0 25px rgba(90,169,255,0.12);
      animation: pulseRing 2.4s ease-in-out infinite;
    }

    .sweep{
      position:absolute;
      inset:10px;
      border-radius:50%;
      background:conic-gradient(from 0deg, transparent 0 300deg, rgba(77,226,255,0.28) 338deg, rgba(77,226,255,0.03) 360deg);
      filter:blur(2px);
      animation: rotateSlow 5s linear infinite;
      opacity:.8;
      pointer-events:none;
    }

    .voice-btn{
      position:relative;
      z-index:2;
      width:110px;
      height:110px;
      border-radius:50%;
      border:1px solid rgba(77,226,255,0.55);
      background:
        radial-gradient(circle at 30% 30%, rgba(255,255,255,0.20), transparent 25%),
        radial-gradient(circle at center, rgba(77,226,255,0.22), rgba(0,188,212,0.14) 45%, rgba(0,0,0,0.18) 100%);
      color:var(--text);
      cursor:pointer;
      user-select:none;
      -webkit-user-select:none;
      -webkit-tap-highlight-color: transparent;
      display:flex;
      align-items:center;
      justify-content:center;
      box-shadow:
        0 0 18px rgba(77,226,255,0.28),
        inset 0 0 20px rgba(77,226,255,0.22),
        inset 0 0 45px rgba(0,0,0,0.18);
      transition: transform .12s ease, box-shadow .18s ease, border-color .18s ease;
      touch-action:none;
    }

    .voice-btn:hover{
      box-shadow:
        0 0 28px rgba(77,226,255,0.40),
        inset 0 0 20px rgba(77,226,255,0.28),
        inset 0 0 45px rgba(0,0,0,0.18);
    }

    .voice-btn:active,
    .voice-btn.pressed{
      transform:scale(.96);
    }

    .voice-btn svg{
      width:46px;
      height:46px;
      filter:drop-shadow(0 0 10px rgba(77,226,255,0.38));
    }

    .waves{
      position:absolute;
      inset:0;
      display:grid;
      place-items:center;
      pointer-events:none;
      opacity:0;
      transition:opacity .18s ease;
    }

    .wave{
      position:absolute;
      width:140px;
      height:140px;
      border-radius:50%;
      border:1px solid rgba(99,255,210,0.45);
      box-shadow:0 0 22px rgba(99,255,210,0.15);
      animation: waveOut 1.8s ease-out infinite;
    }

    .wave:nth-child(2){ animation-delay:.45s; }
    .wave:nth-child(3){ animation-delay:.9s; }

    .meta{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:12px;
      margin-top:8px;
    }
	.logo{
		text-align:center;
	}
	.zoia-logo {
	  pointer-events: none;
	  width:150px;
	  filter: 
		drop-shadow(0 0 10px rgba(0,188,212,0.6))
		drop-shadow(0 0 25px rgba(0,188,212,0.4));
	  opacity: 0.95;
	  animation: floatLogo 3s ease-in-out infinite;
	}
	
	
	
	@keyframes floatLogo {
	  0%,100% { transform: translateY(0px); }
	  50% { transform: translateY(-6px); }
	}
    .card{
      padding:14px 16px;
      border-radius:16px;
      border:1px solid rgba(77,226,255,0.18);
      background:rgba(255,255,255,0.04);
    }

    .card .label{
      font-size:11px;
      letter-spacing:.18em;
      text-transform:uppercase;
      color:var(--muted);
      margin-bottom:7px;
    }

    .card .value{
      font-size:14px;
      color:var(--text);
      word-break:break-word;
      min-height:20px;
    }

    .hint{
      text-align:center;
      color:var(--muted);
      font-size:13px;
      margin-top:18px;
    }

    .audio-player{
      width:100%;
      margin-top:16px;
      opacity:.88;
    }

    .listening .waves{ opacity:1; }
    .listening .voice-btn{
      border-color:rgba(99,255,210,0.95);
      box-shadow:
        0 0 30px rgba(99,255,210,0.35),
        inset 0 0 24px rgba(99,255,210,0.18),
        inset 0 0 45px rgba(0,0,0,0.18);
    }

    .processing .voice-btn{
      border-color:rgba(90,169,255,0.95);
      animation: processingPulse 1s ease-in-out infinite;
    }

    .speaking .voice-btn{
      border-color:rgba(77,226,255,0.95);
      box-shadow:
        0 0 34px rgba(77,226,255,0.45),
        inset 0 0 24px rgba(77,226,255,0.22),
        inset 0 0 45px rgba(0,0,0,0.18);
    }

    .error .status{ color:var(--danger); }

    @keyframes rotateSlow{
      from{ transform:rotate(0deg); }
      to{ transform:rotate(360deg); }
    }

    @keyframes rotateReverse{
      from{ transform:rotate(360deg); }
      to{ transform:rotate(0deg); }
    }

    @keyframes pulseRing{
      0%,100%{ transform:scale(1); opacity:.75; }
      50%{ transform:scale(1.03); opacity:1; }
    }

    @keyframes waveOut{
      0%{ transform:scale(.75); opacity:.9; }
      100%{ transform:scale(1.45); opacity:0; }
    }

    @keyframes processingPulse{
      0%,100%{ transform:scale(1); }
      50%{ transform:scale(1.04); }
    }
  </style>
</head>
<body>
  <div class="hud-bg"></div>

  <div class="panel" id="app">
    <div class="logo"><img src="zoia-logo.png" class="zoia-logo" /></div>
    <div class="status" id="status">Mantén pulsado para hablar</div>

    <div class="core-wrap" id="coreWrap">

  <div class="ring"></div>
  <div class="sweep"></div>

  <div class="waves">
    <div class="wave"></div>
    <div class="wave"></div>
    <div class="wave"></div>
  </div>

  <button id="holdBtn" class="voice-btn">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor">
      <path d="M12 15a3 3 0 0 0 3-3V7a3 3 0 1 0-6 0v5a3 3 0 0 0 3 3Z"/>
      <path d="M19 11a7 7 0 0 1-14 0"/>
      <path d="M12 18v3"/>
      <path d="M8 21h8"/>
    </svg>
  </button>

</div>

    <div class="meta">
      <div class="card">
        <div class="label">Estado</div>
        <div class="value" id="stateValue">En espera</div>
      </div>
      <div class="card">
        <div class="label">Sesión</div>
        <div class="value" id="sessionValue">—</div>
      </div>
      <div class="card">
        <div class="label">Tu mensaje</div>
        <div class="value" id="userText">—</div>
      </div>
      <div class="card">
        <div class="label">Respuesta</div>
        <div class="value" id="assistantText">—</div>
      </div>
    </div>

    <audio id="player" class="audio-player" controls></audio>
    <div class="hint">Mantén pulsado el núcleo central para grabar. Suelta para enviar.</div>
  </div>

  <script>
    const WEBHOOK_URL = 'https://zoia-n8n-n8n.bierdv.easypanel.host/webhook-test/voice-chat';

    const app = document.getElementById('app');
    const holdBtn = document.getElementById('holdBtn');
    const statusEl = document.getElementById('status');
    const stateValue = document.getElementById('stateValue');
    const sessionValue = document.getElementById('sessionValue');
    const userTextEl = document.getElementById('userText');
    const assistantTextEl = document.getElementById('assistantText');
    const player = document.getElementById('player');

    let mediaRecorder = null;
    let mediaStream = null;
    let audioChunks = [];
    let isRecording = false;
    let isBusy = false;
    let activePointerId = null;

    let sessionId = localStorage.getItem('voiceSessionId');
    if (!sessionId) {
      sessionId = 'sess-' + Math.random().toString(36).slice(2) + '-' + Date.now();
      localStorage.setItem('voiceSessionId', sessionId);
    }
    sessionValue.textContent = sessionId;

    function setMode(mode, text) {
      app.classList.remove('listening', 'processing', 'speaking', 'error');

      if (mode) app.classList.add(mode);

      statusEl.textContent = text || '';
      const labels = {
        listening: 'Escuchando',
        processing: 'Procesando',
        speaking: 'Reproduciendo',
        error: 'Error',
        idle: 'En espera'
      };
      stateValue.textContent = labels[mode] || labels.idle;
    }

    function getSupportedMimeType() {
      const types = [
        'audio/webm;codecs=opus',
        'audio/webm',
        'audio/mp4',
        'audio/ogg;codecs=opus',
        'audio/ogg'
      ];

      for (const type of types) {
        if (window.MediaRecorder && MediaRecorder.isTypeSupported(type)) {
          return type;
        }
      }
      return '';
    }

    async function startRecording() {
      if (isBusy || isRecording) return;

      try {
        player.pause();

        const mimeType = getSupportedMimeType();
        mediaStream = await navigator.mediaDevices.getUserMedia({ audio: true });
        audioChunks = [];

        mediaRecorder = mimeType
          ? new MediaRecorder(mediaStream, { mimeType })
          : new MediaRecorder(mediaStream);

        mediaRecorder.ondataavailable = (event) => {
          if (event.data && event.data.size > 0) {
            audioChunks.push(event.data);
          }
        };

        mediaRecorder.start();
        isRecording = true;
        holdBtn.classList.add('pressed');
        setMode('listening', 'Escuchando... suelta para enviar');
      } catch (error) {
        console.error(error);
        setMode('error', 'No se pudo acceder al micrófono');
      }
    }

    async function stopRecordingAndSend() {
      if (!isRecording || !mediaRecorder) return;

      isRecording = false;
      holdBtn.classList.remove('pressed');
      isBusy = true;
      setMode('processing', 'Procesando audio...');

      const stopped = new Promise((resolve) => {
        mediaRecorder.onstop = resolve;
      });

      mediaRecorder.stop();
      if (mediaStream) {
        mediaStream.getTracks().forEach(track => track.stop());
      }

      await stopped;

      try {
        const recordedType = mediaRecorder.mimeType || 'audio/webm';
        const ext = recordedType.includes('ogg')
          ? 'ogg'
          : recordedType.includes('mp4')
          ? 'm4a'
          : 'webm';

        const audioBlob = new Blob(audioChunks, { type: recordedType });
        if (!audioBlob.size) {
          throw new Error('La grabación ha llegado vacía');
        }

        const formData = new FormData();
        formData.append('audio', audioBlob, 'grabacion.' + ext);
        formData.append('sessionId', sessionId);

        const response = await fetch(WEBHOOK_URL, {
          method: 'POST',
          body: formData
        });

        console.log('STATUS:', response.status);
        console.log('CONTENT-TYPE:', response.headers.get('content-type'));

        if (!response.ok) {
          const errorText = await response.text();
          throw new Error(errorText || 'Error en el servidor');
        }

        const contentType = response.headers.get('content-type') || '';

        let audioBlobResponse;
        if (contentType.includes('audio/mpeg')) {
          const arrayBuffer = await response.arrayBuffer();
          audioBlobResponse = new Blob([arrayBuffer], { type: 'audio/mpeg' });
        } else if (contentType.includes('audio/wav') || contentType.includes('audio/x-wav')) {
          const arrayBuffer = await response.arrayBuffer();
          audioBlobResponse = new Blob([arrayBuffer], { type: 'audio/wav' });
        } else if (contentType.includes('application/json')) {
          const data = await response.json();
          console.log('JSON recibido:', data);
          userTextEl.textContent = data.transcript || data.text || '—';
          assistantTextEl.textContent = data.reply || data.response || '—';
          throw new Error('El webhook está devolviendo JSON, no audio binario');
        } else {
          const arrayBuffer = await response.arrayBuffer();
          audioBlobResponse = new Blob([arrayBuffer], { type: 'audio/mpeg' });
        }

        const audioUrl = URL.createObjectURL(audioBlobResponse);
        player.src = audioUrl;
        player.load();

        setMode('speaking', 'Respuesta recibida. Reproduciendo...');
        assistantTextEl.textContent = 'Audio recibido';
        userTextEl.textContent = 'Audio enviado';

        try {
          await player.play();
        } catch (err) {
          console.warn('Reproducción automática bloqueada:', err);
          statusEl.textContent = 'Audio recibido. Pulsa play si no arranca solo';
        }

      } catch (error) {
        console.error(error);
        setMode('error', error.message || 'Ha ocurrido un error');
      } finally {
        isBusy = false;
        mediaRecorder = null;
        mediaStream = null;
        audioChunks = [];
        if (!app.classList.contains('error') && !app.classList.contains('speaking')) {
          setMode('idle', 'Mantén pulsado para hablar');
        }
      }
    }

    player.addEventListener('play', () => {
      setMode('speaking', 'Reproduciendo respuesta...');
    });

    player.addEventListener('ended', () => {
      setMode('idle', 'Mantén pulsado para hablar');
    });

    player.addEventListener('pause', () => {
      if (!isRecording && !isBusy) {
        setMode('idle', 'Mantén pulsado para hablar');
      }
    });

    holdBtn.addEventListener('pointerdown', async (e) => {
      if (isBusy) return;
      activePointerId = e.pointerId;
      holdBtn.setPointerCapture(activePointerId);
      e.preventDefault();
      await startRecording();
    });

    holdBtn.addEventListener('pointerup', async (e) => {
      if (activePointerId !== null && e.pointerId === activePointerId) {
        e.preventDefault();
        activePointerId = null;
        await stopRecordingAndSend();
      }
    });

    holdBtn.addEventListener('pointercancel', async () => {
      activePointerId = null;
      await stopRecordingAndSend();
    });

    holdBtn.addEventListener('lostpointercapture', async () => {
      if (isRecording) {
        activePointerId = null;
        await stopRecordingAndSend();
      }
    });

    setMode('idle', 'Mantén pulsado para hablar');
  </script>
</body>
</html>
