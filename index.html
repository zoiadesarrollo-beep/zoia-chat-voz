<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Z.O.I.A</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #060a14;
      font-family: 'Courier New', monospace;
      color: #4dd9ff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      overflow-x: hidden;
    }

    /* ── HEADER ── */
    .hud-header {
      width: 100%;
      max-width: 480px;
      padding: 20px 24px 8px;
      text-align: center;
    }

    .logo-wrapper {
      width: 100px;
      height: 100px;
      margin: 0 auto 8px;
    }

    .logo-img {
      width: 100px;
      height: 100px;
      border-radius: 50%;
      object-fit: cover;
    }

    .hud-name {
      font-size: 32px;
      font-weight: bold;
      letter-spacing: 14px;
      color: #4dd9ff;
      text-shadow: 0 0 20px rgba(77,217,255,0.4);
    }

    .hud-subtitle {
      font-size: 10px;
      letter-spacing: 3px;
      color: rgba(77,217,255,0.4);
      margin-top: 2px;
    }

    .hud-status {
      font-size: 11px;
      letter-spacing: 2px;
      color: rgba(77,217,255,0.5);
      margin-top: 6px;
    }

    /* ── MIC AREA ── */
    .mic-area {
      margin: 18px auto 12px;
      position: relative;
      width: 130px;
      height: 130px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .mic-ring {
      position: absolute;
      border-radius: 50%;
      border: 1px solid rgba(77,217,255,0.12);
    }
    .mic-ring-1 { width: 130px; height: 130px; }
    .mic-ring-2 { width: 106px; height: 106px; border-color: rgba(77,217,255,0.2); }

    .mic-spin {
      position: absolute;
      border-radius: 50%;
      border: 1px solid transparent;
    }
    .mic-spin-1 {
      width: 128px; height: 128px;
      border-right-color: rgba(77,217,255,0.35);
      animation: spin 4s linear infinite;
    }
    .mic-spin-2 {
      width: 104px; height: 104px;
      border-left-color: rgba(77,217,255,0.25);
      animation: spin 7s linear infinite reverse;
    }

    @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

    .mic-btn {
      position: relative;
      z-index: 10;
      width: 76px;
      height: 76px;
      border-radius: 50%;
      background: rgba(6,10,20,0.95);
      border: 2px solid rgba(77,217,255,0.45);
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 3px;
      transition: all 0.3s ease;
      -webkit-tap-highlight-color: transparent;
      box-shadow: 0 0 18px rgba(77,217,255,0.08), inset 0 0 18px rgba(77,217,255,0.04);
    }
    .mic-btn:active { transform: scale(0.92); }

    .mic-btn.listening {
      border-color: rgba(77,217,255,0.9);
      box-shadow: 0 0 32px rgba(77,217,255,0.4), inset 0 0 20px rgba(77,217,255,0.08);
      animation: pulse-btn 1.4s ease-in-out infinite;
    }
    .mic-btn.processing {
      border-color: rgba(120,180,255,0.7);
      box-shadow: 0 0 24px rgba(120,180,255,0.25);
    }

    @keyframes pulse-btn {
      0%, 100% { box-shadow: 0 0 32px rgba(77,217,255,0.4), inset 0 0 20px rgba(77,217,255,0.08); }
      50% { box-shadow: 0 0 52px rgba(77,217,255,0.65), inset 0 0 28px rgba(77,217,255,0.12); }
    }

    .mic-icon { width: 22px; height: 22px; }
    .mic-label { font-size: 8px; letter-spacing: 2px; color: rgba(77,217,255,0.65); }

    /* ── WAVEFORM ── */
    .waveform-container {
      width: 100%;
      max-width: 480px;
      padding: 0 24px;
      height: 36px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 3px;
      margin-bottom: 6px;
    }
    .wave-bar { width: 3px; background: rgba(77,217,255,0.25); border-radius: 2px; height: 3px; transition: height 0.08s ease; }

    /* ── CONFIG PANEL ── */
    .config-panel {
      width: 100%;
      max-width: 480px;
      padding: 0 24px;
      margin-bottom: 10px;
    }
    .config-toggle {
      background: none; border: none;
      color: rgba(77,217,255,0.35); font-family: 'Courier New', monospace;
      font-size: 9px; letter-spacing: 2px; cursor: pointer;
      padding: 4px 0; width: 100%; text-align: center; text-transform: uppercase;
    }
    .config-toggle:hover { color: rgba(77,217,255,0.65); }
    .config-fields {
      display: none; flex-direction: column; gap: 10px;
      margin-top: 10px; padding: 14px;
      border: 1px solid rgba(77,217,255,0.1); border-radius: 8px;
      background: rgba(77,217,255,0.02);
    }
    .config-fields.open { display: flex; }
    .config-label { font-size: 9px; letter-spacing: 2px; color: rgba(77,217,255,0.45); text-transform: uppercase; margin-bottom: 3px; }
    .config-input {
      background: rgba(77,217,255,0.04); border: 1px solid rgba(77,217,255,0.18);
      color: #4dd9ff; font-family: 'Courier New', monospace; font-size: 11px;
      padding: 7px 10px; border-radius: 4px; outline: none; width: 100%;
    }
    .config-input:focus { border-color: rgba(77,217,255,0.45); }
    .config-input::placeholder { color: rgba(77,217,255,0.2); }
    .config-save {
      background: rgba(77,217,255,0.06); border: 1px solid rgba(77,217,255,0.25);
      color: #4dd9ff; font-family: 'Courier New', monospace; font-size: 9px;
      letter-spacing: 2px; text-transform: uppercase; padding: 7px;
      border-radius: 4px; cursor: pointer; transition: all 0.2s;
    }
    .config-save:hover { background: rgba(77,217,255,0.12); }

    /* ── CHAT LOG ── */
    .chat-log {
      width: 100%; max-width: 480px; flex: 1;
      padding: 0 24px 24px; display: flex; flex-direction: column;
      gap: 10px; overflow-y: auto; -webkit-overflow-scrolling: touch;
    }

    .msg { display: flex; flex-direction: column; gap: 3px; animation: msg-in 0.3s ease; }
    @keyframes msg-in { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: none; } }

    .msg-meta { font-size: 9px; letter-spacing: 2px; text-transform: uppercase; opacity: 0.4; }
    .msg-user .msg-meta { color: rgba(77,217,255,0.7); text-align: right; }
    .msg-zoia .msg-meta { color: rgba(160,220,255,0.7); }

    .msg-bubble {
      padding: 9px 12px; border-radius: 8px; font-size: 12px;
      line-height: 1.6; max-width: 90%;
    }
    .msg-user .msg-bubble {
      background: rgba(77,217,255,0.06); border: 1px solid rgba(77,217,255,0.14);
      align-self: flex-end; color: #b3ecff;
    }
    .msg-zoia .msg-bubble {
      background: rgba(120,180,255,0.05); border: 1px solid rgba(120,180,255,0.12);
      align-self: flex-start; color: #c5e8ff;
    }
    .msg-error .msg-bubble {
      background: rgba(255,100,77,0.05); border: 1px solid rgba(255,100,77,0.18);
      color: #ff9999;
    }

    .audio-player {
      margin-top: 6px;
      align-self: flex-start;
    }
    .audio-player audio {
      width: 220px;
      height: 32px;
      filter: invert(0.85) hue-rotate(175deg);
    }

    .typing-dots span {
      display: inline-block; width: 5px; height: 5px;
      background: rgba(120,180,255,0.6); border-radius: 50%; margin-right: 3px;
      animation: dot-bounce 1.2s infinite;
    }
    .typing-dots span:nth-child(2) { animation-delay: 0.2s; }
    .typing-dots span:nth-child(3) { animation-delay: 0.4s; }
    @keyframes dot-bounce { 0%,60%,100%{transform:translateY(0)} 30%{transform:translateY(-5px)} }

    /* ── STATUS BAR ── */
    .status-bar {
      width: 100%; max-width: 480px;
      padding: 4px 24px 14px;
      display: flex; align-items: center; justify-content: center; gap: 6px;
    }
    .status-dot { width: 5px; height: 5px; border-radius: 50%; background: rgba(77,217,255,0.25); }
    .status-dot.on { background: #4dd9ff; box-shadow: 0 0 6px rgba(77,217,255,0.6); animation: blink 1.5s infinite; }
    .status-dot.warn { background: rgba(120,180,255,0.8); }
    @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0.3} }
    .status-text { font-size: 9px; letter-spacing: 2px; text-transform: uppercase; color: rgba(77,217,255,0.4); }
  </style>
</head>

  <!-- CONFIG -->
  <div class="config-panel">
    <button class="config-toggle" onclick="toggleConfig()">⚙ Configuración ▾</button>
    <div class="config-fields" id="configFields">
      <div>
        <div class="config-label">N8N Webhook URL</div>
        <input class="config-input" id="webhookUrl" type="url" placeholder="https://zoia-n8n-n8n.bierdv.easypanel.host/webhook/voice-chat" />
      </div>
      <div>
        <div class="config-label">Idioma de escucha</div>
        <select class="config-input" id="langSelect">
          <option value="es-ES">Español (España)</option>

  <!-- CHAT -->
  <div class="chat-log" id="chatLog">
    <div class="msg msg-zoia">
      <div class="msg-meta">Z.O.I.A · Sistema listo</div>

  <!-- STATUS BAR -->
  <div class="status-bar">
    <div class="status-dot" id="statusDot"></div>
    <div class="status-text" id="statusText">Sistema en espera</div>
  </div>

  <script>
    let recognition = null;
    let isListening = false;
    let mediaRecorder = null;
    let audioChunks = [];
    let currentStream = null;
    let typingEl = null;

    const micBtn = document.getElementById("micBtn");
    const micLabel = document.getElementById("micLabel");
    const hudStatus = document.getElementById("hud-status");
    const chatLog = document.getElementById("chatLog");
    const statusDot = document.getElementById("statusDot");
    const statusText = document.getElementById("statusText");

    function loadConfig() {
      document.getElementById("webhookUrl").value = localStorage.getItem("z_webhook") || "";
      document.getElementById("langSelect").value = localStorage.getItem("z_lang") || "es-ES";
      document.getElementById("sendMode").value = localStorage.getItem("z_mode") || "text";
    }
    function saveConfig() {
      localStorage.setItem("z_webhook", document.getElementById("webhookUrl").value.trim());
      localStorage.setItem("z_lang", document.getElementById("langSelect").value);
      localStorage.setItem("z_mode", document.getElementById("sendMode").value);
      toggleConfig();
      setStatus("Configuración guardada", "on");
    }
    function toggleConfig() {
      document.getElementById("configFields").classList.toggle("open");
    }

    function buildWaveform() {
      const wv = document.getElementById("waveform");
      for (let i = 0; i < 26; i++) {
        const b = document.createElement("div");
        b.className = "wave-bar"; b.id = "bar" + i;
        wv.appendChild(b);
      }
    }

    let waveInterval = null;
    function startWave() {
      stopWave();
      waveInterval = setInterval(() => {
        for (let i = 0; i < 26; i++) {
          const h = Math.random() * 26 + 3;
          const b = document.getElementById("bar" + i);
          if (b) { b.style.height = h + "px"; b.style.background = "rgba(77,217,255,0.65)"; }
        }
      }, 75);
    }
    function stopWave() {
      clearInterval(waveInterval);
      for (let i = 0; i < 26; i++) {
        const b = document.getElementById("bar" + i);
        if (b) { b.style.height = "3px"; b.style.background = "rgba(77,217,255,0.22)"; }
      }
    }

    function setStatus(text, type) {
      statusText.textContent = text;
      hudStatus.textContent = text;
      statusDot.className = "status-dot" + (type ? " " + type : "");
    }

    function addMessage(role, text) {
      const div = document.createElement("div");
      div.className = "msg msg-" + role;
      const labels = { user: "Tú", zoia: "Z.O.I.A", error: "Sistema · Error" };
      div.innerHTML = "<div class=\"msg-meta\">" + (labels[role] || role) + "</div><div class=\"msg-bubble\">" + text + "</div>";
      chatLog.appendChild(div);
      chatLog.scrollTop = chatLog.scrollHeight;
      return div;
    }

    function addAudioMessage(audioUrl, mimeType) {
      const div = document.createElement("div");
      div.className = "msg msg-zoia";
      const mt = mimeType || "audio/mpeg";
      div.innerHTML =
        "<div class=\"msg-meta\">Z.O.I.A · audio</div>" +
        "<div class=\"msg-bubble\">Respuesta de voz</div>" +
        "<div class=\"audio-player\">" +
          "<audio controls autoplay>" +
            "<source src=\"" + audioUrl + "\" type=\"" + mt + "\">" +
            "Tu navegador no soporta audio." +
          "</audio>" +
        "</div>";
      chatLog.appendChild(div);
      chatLog.scrollTop = chatLog.scrollHeight;
    }

    function showTyping() {
      typingEl = document.createElement("div");
      typingEl.className = "msg msg-zoia";
      typingEl.innerHTML = "<div class=\"msg-meta\">Z.O.I.A · procesando</div><div class=\"msg-bubble\"><div class=\"typing-dots\"><span></span><span></span><span></span></div></div>";
      chatLog.appendChild(typingEl);
      chatLog.scrollTop = chatLog.scrollHeight;
    }
    function hideTyping() {
      if (typingEl) { typingEl.remove(); typingEl = null; }
    }

    // Detect if response is audio by content-type
    function isAudioContentType(ct) {
      return ct && (ct.includes("audio/") || ct.includes("application/octet-stream"));
    }

    async function sendToN8N(transcript, audioBlob) {
      const webhook = localStorage.getItem("z_webhook");
      if (!webhook) {
        addMessage("error", "Sin webhook configurado. Abre ⚙ Configuración e introduce la URL de n8n.");
        return;
      }
      const mode = localStorage.getItem("z_mode") || "text";
      showTyping();
      setStatus("Enviando a n8n...", "warn");
      try {
        let response;
        if (mode === "audio" && audioBlob) {
          const form = new FormData();
          form.append("transcript", transcript);
          form.append("audio", audioBlob, "voice.webm");
          form.append("timestamp", new Date().toISOString());
          response = await fetch(webhook, { method: "POST", body: form });
        } else {
          response = await fetch(webhook, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ message: transcript, timestamp: new Date().toISOString(), source: "zoia-voice" })
          });
        }
        hideTyping();
        if (!response.ok) throw new Error("HTTP " + response.status);

        const ct = response.headers.get("content-type") || "";

        // ── Audio response ──
        if (isAudioContentType(ct)) {
          const blob = await response.blob();
          const audioUrl = URL.createObjectURL(blob);
          addAudioMessage(audioUrl, blob.type || "audio/mpeg");
          setStatus("Audio recibido", "on");
          return;
        }

        // ── JSON response ──
        if (ct.includes("application/json")) {
          const data = await response.json();

          // JSON may contain a base64 audio field
          if (data.audio) {
            const audioData = data.audio.startsWith("data:") ? data.audio : "data:audio/mpeg;base64," + data.audio;
            addAudioMessage(audioData, "audio/mpeg");
          } else if (data.audio_url || data.audioUrl) {
            addAudioMessage(data.audio_url || data.audioUrl, "audio/mpeg");
          } else {
            // Plain text reply
            const reply = data.reply || data.response || data.message || data.output || data.text || JSON.stringify(data);
            if (reply) addMessage("zoia", reply);
          }
          setStatus("Respuesta recibida", "on");
          return;
        }

        // ── Plain text fallback ──
        const reply = await response.text();
        if (reply) addMessage("zoia", reply);
        setStatus("Respuesta recibida", "on");

      } catch (err) {
        hideTyping();
        addMessage("error", "Error de conexión: " + err.message);
        setStatus("Error de red", "");
      }
    }

    function initRecognition() {
      const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!SR) return null;
      const r = new SR();
      r.continuous = false; r.interimResults = false;
      r.lang = localStorage.getItem("z_lang") || "es-ES";
      r.onresult = (e) => {
        const t = e.results[0][0].transcript.trim();
        if (t) { addMessage("user", t); sendToN8N(t, null); }
      };
      r.onerror = (e) => { if (e.error !== "no-speech") addMessage("error", "Error: " + e.error); stopListening(); };
      r.onend = () => stopListening();
      return r;
    }

    async function startListening() {
      if (isListening) { stopListening(); return; }
      const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!SR) { addMessage("error", "Reconocimiento de voz no soportado. Usa Chrome o Safari."); return; }
      const mode = localStorage.getItem("z_mode") || "text";
      if (mode === "audio") {
        try {
          currentStream = await navigator.mediaDevices.getUserMedia({ audio: true });
          audioChunks = [];
          mediaRecorder = new MediaRecorder(currentStream);
          mediaRecorder.ondataavailable = e => { if (e.data.size > 0) audioChunks.push(e.data); };
          mediaRecorder.start();
        } catch (e) { addMessage("error", "Sin acceso al micrófono: " + e.message); return; }
      }
      recognition = initRecognition();
      if (!recognition) return;
      isListening = true;
      micBtn.classList.add("listening");
      micLabel.textContent = "ESCUCHA";
      setStatus("Escuchando...", "on");
      startWave();
      try { recognition.lang = localStorage.getItem("z_lang") || "es-ES"; recognition.start(); } catch (e) { stopListening(); }
    }

    function stopListening() {
      isListening = false;
      micBtn.classList.remove("listening");
      micLabel.textContent = "PULSAR";
      setStatus("Sistema en espera", "");
      stopWave();
      if (recognition) { try { recognition.stop(); } catch(e){} recognition = null; }
      if (mediaRecorder && mediaRecorder.state !== "inactive") { mediaRecorder.stop(); }
      if (currentStream) { currentStream.getTracks().forEach(t => t.stop()); currentStream = null; }
    }

    micBtn.addEventListener("click", startListening);
    loadConfig();
    buildWaveform();
    setStatus("Sistema en espera", "");
  </script>
</body>
</html>
