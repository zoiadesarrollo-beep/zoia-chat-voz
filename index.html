<!doctype html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Zoia One</title>

<link rel="icon" type="image/png" href="favicon_zoia.png">

<style>
body{
  margin:0;
  background:#03131f;
  color:#dffbff;
  font-family:Arial;
  display:flex;
  justify-content:center;
  align-items:center;
  height:100vh;
}

.container{
  text-align:center;
}

button{
  width:120px;
  height:120px;
  border-radius:50%;
  border:none;
  background:#00bcd4;
  color:white;
  font-size:30px;
  cursor:pointer;
}

button:active{
  background:#0097a7;
}

.status{
  margin-top:20px;
}

audio{
  margin-top:20px;
  width:100%;
}
</style>
</head>

<body>

<div class="container">
  <button id="micBtn">🎤</button>
  <div class="status" id="status">Pulsa y habla</div>
  <audio id="player" controls></audio>
</div>

<script>
const WEBHOOK_URL = 'https://zoia-n8n-n8n.bierdv.easypanel.host/webhook/voice-chat';

let mediaRecorder;
let audioChunks = [];
let isRecording = false;

const micBtn = document.getElementById('micBtn');
const statusEl = document.getElementById('status');
const player = document.getElementById('player');

let sessionId = localStorage.getItem('voiceSessionId');
if (!sessionId) {
  sessionId = 'sess-' + Math.random().toString(36).slice(2);
  localStorage.setItem('voiceSessionId', sessionId);
}

// 🎤 iniciar grabación
async function startRecording() {
  if (isRecording) return;

  const stream = await navigator.mediaDevices.getUserMedia({ audio: true });

  mediaRecorder = new MediaRecorder(stream);
  audioChunks = [];

  mediaRecorder.ondataavailable = e => {
    if (e.data.size > 0) audioChunks.push(e.data);
  };

  mediaRecorder.start();
  isRecording = true;

  statusEl.textContent = 'Grabando...';
}

// 🛑 parar grabación y enviar
async function stopRecording() {
  if (!isRecording) return;

  isRecording = false;

  const stopped = new Promise(resolve => {
    mediaRecorder.onstop = resolve;
  });

  mediaRecorder.stop();
  await stopped;

  const blob = new Blob(audioChunks, { type: 'audio/webm' });

  statusEl.textContent = 'Enviando...';

  try {
    const formData = new FormData();
    formData.append('audio', blob, 'audio.webm');
    formData.append('sessionId', sessionId);

    const res = await fetch(WEBHOOK_URL, {
      method: 'POST',
      body: formData
    });

    const buffer = await res.arrayBuffer();
    const audioBlob = new Blob([buffer], { type: 'audio/mpeg' });
    const url = URL.createObjectURL(audioBlob);

    player.src = url;
    await player.play();

    statusEl.textContent = 'Respuesta recibida';
  } catch (e) {
    console.error(e);
    statusEl.textContent = 'Error';
  }
}

// 🖱️ eventos botón
micBtn.addEventListener('mousedown', startRecording);
micBtn.addEventListener('mouseup', stopRecording);

// 📱 móvil
micBtn.addEventListener('touchstart', (e) => {
  e.preventDefault();
  startRecording();
});

micBtn.addEventListener('touchend', (e) => {
  e.preventDefault();
  stopRecording();
});
</script>

</body>
</html>
