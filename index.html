<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Zoia One</title>

  <link rel="icon" type="image/png" href="favicon_zoia.png">
  <link rel="apple-touch-icon" href="favicon_zoia.png">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#03131f">

  <style>
    :root{
      --bg1:#03131f;
      --bg2:#071f30;
      --cyan:#4de2ff;
      --cyan2:#00bcd4;
      --blue:#5aa9ff;
      --glass:rgba(255,255,255,0.06);
      --glass-border:rgba(77,226,255,0.25);
      --text:#dffbff;
      --muted:#8fbac3;
      --danger:#ff5f7a;
      --ok:#63ffd2;
    }

    *{box-sizing:border-box}

    body{
      margin:0;
      min-height:100vh;
      display:flex;
      align-items:center;
      justify-content:center;
      background:
        radial-gradient(circle at 50% 50%, rgba(0,188,212,0.10), transparent 22%),
        radial-gradient(circle at 50% 50%, rgba(90,169,255,0.08), transparent 38%),
        linear-gradient(180deg,var(--bg2),var(--bg1));
      font-family: Inter, Arial, sans-serif;
      color:var(--text);
      overflow:hidden;
    }

    .hud-bg{
      position:fixed;
      inset:0;
      pointer-events:none;
      background:
        radial-gradient(circle at center, rgba(77,226,255,0.08) 0 2px, transparent 2px 100%),
        linear-gradient(rgba(77,226,255,0.05) 1px, transparent 1px),
        linear-gradient(90deg, rgba(77,226,255,0.05) 1px, transparent 1px);
      background-size:100% 100%, 100% 34px, 34px 100%;
      mask-image: radial-gradient(circle at center, black 0%, rgba(0,0,0,0.85) 45%, transparent 85%);
      opacity:.35;
    }

    .panel{
      position:relative;
      width:min(92vw, 560px);
      padding:36px 24px 28px;
      border:1px solid var(--glass-border);
      border-radius:28px;
      background:linear-gradient(180deg, rgba(255,255,255,0.08), rgba(255,255,255,0.03));
      backdrop-filter: blur(12px);
      box-shadow:
        0 0 0 1px rgba(77,226,255,0.06) inset,
        0 0 30px rgba(0,188,212,0.12),
        0 0 90px rgba(0,188,212,0.08);
    }

    .panel::before,
    .panel::after{
      content:"";
      position:absolute;
      width:80px;
      height:80px;
      border:2px solid rgba(77,226,255,0.4);
      opacity:.55;
      pointer-events:none;
    }

    .panel::before{
      top:12px;
      left:12px;
      border-right:none;
      border-bottom:none;
      border-radius:18px 0 0 0;
    }

    .panel::after{
      right:12px;
      bottom:12px;
      border-left:none;
      border-top:none;
      border-radius:0 0 18px 0;
    }

    .zoia-logo-top{
      display:block;
      margin:0 auto 12px;
      width:140px;
      filter:
        drop-shadow(0 0 10px rgba(0,188,212,0.6))
        drop-shadow(0 0 25px rgba(0,188,212,0.35));
      opacity:.96;
      animation: floatLogo 3s ease-in-out infinite;
    }

    .title{
      text-align:center;
      font-size:12px;
      letter-spacing:.35em;
      text-transform:uppercase;
      color:var(--muted);
      margin-bottom:8px;
    }

    .status{
      text-align:center;
      font-size:16px;
      min-height:24px;
      color:var(--text);
      margin-bottom:20px;
    }

    .core-wrap{
      position:relative;
      width:220px;
      height:220px;
      margin:0 auto 20px;
      display:grid;
      place-items:center;
    }

    .ring,
    .ring::before,
    .ring::after{
      position:absolute;
      border-radius:50%;
      inset:0;
    }

    .ring{
      border:1px solid rgba(77,226,255,0.35);
      box-shadow:0 0 20px rgba(77,226,255,0.18), inset 0 0 12px rgba(77,226,255,0.15);
      animation: rotateSlow 18s linear infinite;
    }

    .ring::before{
      content:"";
      inset:16px;
      border:1px dashed rgba(77,226,255,0.28);
      animation: rotateReverse 14s linear infinite;
    }

    .ring::after{
      content:"";
      inset:34px;
      border:1px solid rgba(90,169,255,0.35);
      box-shadow:0 0 25px rgba(90,169,255,0.12);
      animation: pulseRing 2.4s ease-in-out infinite;
    }

    .sweep{
      position:absolute;
      inset:10px;
      border-radius:50%;
      background:conic-gradient(from 0deg, transparent 0 300deg, rgba(77,226,255,0.28) 338deg, rgba(77,226,255,0.03) 360deg);
      filter:blur(2px);
      animation: rotateSlow 5s linear infinite;
      opacity:.8;
      pointer-events:none;
    }

    .core-dot{
      position:relative;
      z-index:2;
      width:110px;
      height:110px;
      border-radius:50%;
      border:1px solid rgba(77,226,255,0.55);
      background:
        radial-gradient(circle at 30% 30%, rgba(255,255,255,0.20), transparent 25%),
        radial-gradient(circle at center, rgba(77,226,255,0.22), rgba(0,188,212,0.14) 45%, rgba(0,0,0,0.18) 100%);
      box-shadow:
        0 0 18px rgba(77,226,255,0.28),
        inset 0 0 20px rgba(77,226,255,0.22),
        inset 0 0 45px rgba(0,0,0,0.18);
      display:flex;
      align-items:center;
      justify-content:center;
      transition: transform .18s ease, box-shadow .18s ease, border-color .18s ease;
    }

    .core-dot svg{
      width:42px;
      height:42px;
      stroke: var(--text);
      fill:none;
      stroke-width:1.8;
      stroke-linecap:round;
      stroke-linejoin:round;
      filter:drop-shadow(0 0 10px rgba(77,226,255,0.38));
    }

    .waves{
      position:absolute;
      inset:0;
      display:grid;
      place-items:center;
      pointer-events:none;
      opacity:0;
      transition:opacity .18s ease;
    }

    .wave{
      position:absolute;
      width:140px;
      height:140px;
      border-radius:50%;
      border:1px solid rgba(99,255,210,0.45);
      box-shadow:0 0 22px rgba(99,255,210,0.15);
      animation: waveOut 1.8s ease-out infinite;
    }

    .wave:nth-child(2){ animation-delay:.45s; }
    .wave:nth-child(3){ animation-delay:.9s; }

    .meta{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:12px;
      margin-top:8px;
    }

    .card{
      padding:14px 16px;
      border-radius:16px;
      border:1px solid rgba(77,226,255,0.18);
      background:rgba(255,255,255,0.04);
    }

    .card .label{
      font-size:11px;
      letter-spacing:.18em;
      text-transform:uppercase;
      color:var(--muted);
      margin-bottom:7px;
    }

    .card .value{
      font-size:14px;
      color:var(--text);
      word-break:break-word;
      min-height:20px;
    }

    .hint{
      text-align:center;
      color:var(--muted);
      font-size:13px;
      margin-top:16px;
    }

    .audio-player{
      width:100%;
      margin-top:14px;
      opacity:.88;
    }

    .listening .waves{ opacity:1; }
    .listening .core-dot{
      border-color:rgba(99,255,210,0.95);
      box-shadow:
        0 0 30px rgba(99,255,210,0.35),
        inset 0 0 24px rgba(99,255,210,0.18),
        inset 0 0 45px rgba(0,0,0,0.18);
    }

    .processing .core-dot{
      border-color:rgba(90,169,255,0.95);
      animation: processingPulse 1s ease-in-out infinite;
    }

    .speaking .core-dot{
      border-color:rgba(77,226,255,0.95);
      box-shadow:
        0 0 34px rgba(77,226,255,0.45),
        inset 0 0 24px rgba(77,226,255,0.22),
        inset 0 0 45px rgba(0,0,0,0.18);
    }

    .error .status{ color:var(--danger); }

    @keyframes rotateSlow{
      from{ transform:rotate(0deg); }
      to{ transform:rotate(360deg); }
    }

    @keyframes rotateReverse{
      from{ transform:rotate(360deg); }
      to{ transform:rotate(0deg); }
    }

    @keyframes pulseRing{
      0%,100%{ transform:scale(1); opacity:.75; }
      50%{ transform:scale(1.03); opacity:1; }
    }

    @keyframes waveOut{
      0%{ transform:scale(.75); opacity:.9; }
      100%{ transform:scale(1.45); opacity:0; }
    }

    @keyframes processingPulse{
      0%,100%{ transform:scale(1); }
      50%{ transform:scale(1.04); }
    }

    @keyframes floatLogo {
      0%,100% { transform: translateY(0px); }
      50% { transform: translateY(-6px); }
    }
  </style>
</head>
<body>
  <div class="hud-bg"></div>

  <div class="panel" id="app">
    <img src="zoia-logo.png" class="zoia-logo-top" alt="Zoia One">

    <div class="title">Voice Interface</div>
    <div class="status" id="status">Iniciando Zoia...</div>

    <div class="core-wrap">
      <div class="ring"></div>
      <div class="sweep"></div>

      <div class="waves">
        <div class="wave"></div>
        <div class="wave"></div>
        <div class="wave"></div>
      </div>

      <div class="core-dot">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M12 15a3 3 0 0 0 3-3V7a3 3 0 1 0-6 0v5a3 3 0 0 0 3 3Z"/>
          <path d="M19 11a7 7 0 0 1-14 0"/>
          <path d="M12 18v3"/>
          <path d="M8 21h8"/>
        </svg>
      </div>
    </div>

    <div class="meta">
      <div class="card">
        <div class="label">Estado</div>
        <div class="value" id="stateValue">Cargando</div>
      </div>
      <div class="card">
        <div class="label">Sesión</div>
        <div class="value" id="sessionValue">—</div>
      </div>
      <div class="card">
        <div class="label">Tu mensaje</div>
        <div class="value" id="userText">—</div>
      </div>
      <div class="card">
        <div class="label">Respuesta</div>
        <div class="value" id="assistantText">—</div>
      </div>
    </div>

    <audio id="player" class="audio-player" controls></audio>
    <div class="hint">Zoia escucha automáticamente. Habla cuando termine el saludo.</div>
  </div>

  <script>
    const WEBHOOK_URL = 'https://zoia-n8n-n8n.bierdv.easypanel.host/webhook/voice-chat';

    const app = document.getElementById('app');
    const statusEl = document.getElementById('status');
    const stateValue = document.getElementById('stateValue');
    const sessionValue = document.getElementById('sessionValue');
    const userTextEl = document.getElementById('userText');
    const assistantTextEl = document.getElementById('assistantText');
    const player = document.getElementById('player');

    let mediaRecorder = null;
    let mediaStream = null;
    let audioChunks = [];
    let audioContext = null;
    let analyser = null;
    let source = null;
    let silenceTimer = null;
    let volumeLoop = null;

    let isRecording = false;
    let isProcessing = false;
    let isSpeaking = false;
    let hasStarted = false;

    const SILENCE_THRESHOLD = 40;
    const SILENCE_DURATION = 1400;
    const MIN_RECORD_MS = 3500;

    let recordingStartedAt = 0;

    let sessionId = localStorage.getItem('voiceSessionId');
    if (!sessionId) {
      sessionId = 'sess-' + Math.random().toString(36).slice(2) + '-' + Date.now();
      localStorage.setItem('voiceSessionId', sessionId);
    }
    sessionValue.textContent = sessionId;

    function setMode(mode, text) {
      app.classList.remove('listening', 'processing', 'speaking', 'error');
      if (mode && mode !== 'idle') app.classList.add(mode);

      statusEl.textContent = text || '';

      const labels = {
        idle: 'En espera',
        listening: 'Escuchando',
        processing: 'Procesando',
        speaking: 'Hablando',
        error: 'Error'
      };

      stateValue.textContent = labels[mode] || 'En espera';
    }

    function speakWelcomeText() {
      const msg = 'Hola, soy Zoia. Ya estoy lista. Puedes hablar cuando quieras.';
      assistantTextEl.textContent = msg;

      if (!('speechSynthesis' in window)) {
        return Promise.resolve();
      }

      return new Promise((resolve) => {
        const utter = new SpeechSynthesisUtterance(msg);
        utter.lang = 'es-ES';
        utter.rate = 1;
        utter.pitch = 1;

        utter.onstart = () => {
          isSpeaking = true;
          setMode('speaking', 'Zoia te da la bienvenida...');
        };

        utter.onend = () => {
          isSpeaking = false;
          resolve();
        };

        utter.onerror = () => {
          isSpeaking = false;
          resolve();
        };

        speechSynthesis.cancel();
        speechSynthesis.speak(utter);
      });
    }

    function getSupportedMimeType() {
      const types = [
        'audio/webm;codecs=opus',
        'audio/webm',
        'audio/mp4',
        'audio/ogg;codecs=opus',
        'audio/ogg'
      ];

      for (const type of types) {
        if (window.MediaRecorder && MediaRecorder.isTypeSupported(type)) {
          return type;
        }
      }
      return '';
    }

    async function setupMic() {
      const mimeType = getSupportedMimeType();
      mediaStream = await navigator.mediaDevices.getUserMedia({
        audio: {
          echoCancellation: true,
          noiseSuppression: true,
          autoGainControl: true
        }
      });

      audioContext = new (window.AudioContext || window.webkitAudioContext)();
      source = audioContext.createMediaStreamSource(mediaStream);
      analyser = audioContext.createAnalyser();
      analyser.fftSize = 2048;
      source.connect(analyser);

      mediaRecorder = mimeType
        ? new MediaRecorder(mediaStream, { mimeType })
        : new MediaRecorder(mediaStream);

      mediaRecorder.ondataavailable = (event) => {
        if (event.data && event.data.size > 0) {
          audioChunks.push(event.data);
        }
      };
    }

    function getVolumeLevel() {
      if (!analyser) return 0;

      const data = new Uint8Array(analyser.fftSize);
      analyser.getByteTimeDomainData(data);

      let sum = 0;
      for (let i = 0; i < data.length; i++) {
        const v = (data[i] - 128) / 128;
        sum += v * v;
      }

      const rms = Math.sqrt(sum / data.length);
      return Math.round(rms * 100);
    }

    function beginListeningLoop() {
      if (isProcessing || isSpeaking || isRecording || !mediaRecorder) return;

      audioChunks = [];
      silenceTimer = null;
      recordingStartedAt = Date.now();

      mediaRecorder.start(200);
      isRecording = true;
      setMode('listening', 'Te escucho...');
      watchSilence();
    }

    function watchSilence() {
      cancelAnimationFrame(volumeLoop);

      const check = () => {
        if (!isRecording || isProcessing || isSpeaking) return;

        const volume = getVolumeLevel();

        if (volume > SILENCE_THRESHOLD) {
          if (silenceTimer) {
            clearTimeout(silenceTimer);
            silenceTimer = null;
          }
        } else {
          if (!silenceTimer && Date.now() - recordingStartedAt > MIN_RECORD_MS) {
            silenceTimer = setTimeout(() => {
              stopAndSend();
            }, SILENCE_DURATION);
          }
        }

        volumeLoop = requestAnimationFrame(check);
      };

      volumeLoop = requestAnimationFrame(check);
    }

    async function stopAndSend() {
      if (!isRecording) return;

      isRecording = false;
      isProcessing = true;

      if (silenceTimer) {
        clearTimeout(silenceTimer);
        silenceTimer = null;
      }

      cancelAnimationFrame(volumeLoop);
      setMode('processing', 'Procesando tu mensaje...');

      const stopped = new Promise((resolve) => {
        mediaRecorder.onstop = resolve;
      });

      mediaRecorder.stop();
      await stopped;

      try {
        const recordedType = mediaRecorder.mimeType || 'audio/webm';
        const ext = recordedType.includes('ogg')
          ? 'ogg'
          : recordedType.includes('mp4')
          ? 'm4a'
          : 'webm';

        const blob = new Blob(audioChunks, { type: recordedType });

        if (!blob.size || blob.size < 1500) {
          isProcessing = false;
          setMode('idle', 'No he detectado voz clara. Puedes hablar otra vez.');
          setTimeout(() => beginListeningLoop(), 600);
          return;
        }
        if (blob.size < 5000) {
          console.log('Audio demasiado pequeño, ignorando...');
          isProcessing = false;
          setMode('idle', 'Esperando voz real...');
          setTimeout(() => beginListeningLoop(), 500);
          return;
        }

        const formData = new FormData();
        formData.append('audio', blob, 'grabacion.' + ext);
        formData.append('sessionId', sessionId);

        const response = await fetch(WEBHOOK_URL, {
          method: 'POST',
          body: formData
        });

        if (!response.ok) {
          const errorText = await response.text();
          throw new Error(errorText || 'Error en el servidor');
        }

        const contentType = response.headers.get('content-type') || '';

        if (contentType.includes('application/json')) {
          const data = await response.json();
          userTextEl.textContent = data.transcript || 'Audio enviado';
          assistantTextEl.textContent = data.reply || data.response || 'Respuesta recibida';
          throw new Error('El webhook está devolviendo JSON y no audio');
        }

        const arrayBuffer = await response.arrayBuffer();
        const audioBlob = new Blob([arrayBuffer], {
          type: contentType.includes('wav') ? 'audio/wav' : 'audio/mpeg'
        });

        const url = URL.createObjectURL(audioBlob);
        player.src = url;
        player.load();

        userTextEl.textContent = 'Mensaje enviado';
        assistantTextEl.textContent = 'Respuesta de Zoia';

        isProcessing = false;
        isSpeaking = true;
        setMode('speaking', 'Zoia está respondiendo...');

        try {
          await player.play();
        } catch (e) {
          console.warn('Autoplay bloqueado:', e);
          isSpeaking = false;
          setMode('idle', 'Pulsa play en el reproductor y luego sigue hablando.');
        }

      } catch (error) {
        console.error(error);
        isProcessing = false;
        setMode('error', error.message || 'Ha ocurrido un error');
        setTimeout(() => {
          setMode('idle', 'Vuelvo a escuchar...');
          beginListeningLoop();
        }, 1500);
      }
    }

    player.addEventListener('play', () => {
      isSpeaking = true;
      setMode('speaking', 'Zoia está hablando...');
    });

    player.addEventListener('ended', () => {
      isSpeaking = false;
      setMode('idle', 'Puedes hablar');
      setTimeout(() => beginListeningLoop(), 400);
    });

    player.addEventListener('pause', () => {
      if (!isProcessing && isSpeaking) {
        isSpeaking = false;
        setMode('idle', 'Puedes hablar');
        setTimeout(() => beginListeningLoop(), 400);
      }
    });

    async function bootstrap() {
      if (hasStarted) return;
      hasStarted = true;

      try {
        setMode('processing', 'Solicitando acceso al micrófono...');
        await setupMic();

        setMode('idle', 'Zoia iniciada');


        setMode('idle', 'Puedes hablar');
        setTimeout(() => beginListeningLoop(), 500);

      } catch (error) {
        console.error(error);
        setMode('error', 'No se pudo iniciar el micrófono');
      }
    }

    window.addEventListener('load', bootstrap);
  </script>
</body>
</html>
